<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Network Anomaly Detection — Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:         #030a21;
      --surface:    #0b0e1a;
      --surface2:   #080b14;
      --border:     #1e2d45;
      --accent:     #00d4ff;
      --red:        #ff4757;
      --green:      #2ed573;
      --warn:       #ffa502;
      --text:       #e2e8f0;
      --muted:      #64748b;
      --mono:       'JetBrains Mono', monospace;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }
    #root { min-height: 100vh; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes pulse   { 0%,100%{opacity:1} 50%{opacity:0.35} }
    @keyframes flashIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:none} }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const API = "http://127.0.0.1:5000";
const POLL_MS = 2000;   // 2s — fast enough to catch attack bursts
const WINDOW  = 60;     // keep last 60 data points on spike chart = ~2 min

function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}

// ── Tiny chart wrapper ───────────────────────────────────────────────────────
function ChartCanvas({ id, type, data, options, height = 180 }) {
  const ref    = useRef(null);
  const inst   = useRef(null);
  const serial = JSON.stringify(data);

  useEffect(() => {
    if (!ref.current) return;
    if (inst.current) inst.current.destroy();
    inst.current = new Chart(ref.current, { type, data, options });
    return () => { if (inst.current) inst.current.destroy(); };
  }, [serial]);

  return <canvas ref={ref} style={{ height, maxHeight: height }} />;
}

// ── Stat card ────────────────────────────────────────────────────────────────
function Card({ label, value, sub, color }) {
  return (
    <div style={{ background:"var(--surface)", border:"1px solid var(--border)", borderTop:`2px solid ${color}`, borderRadius:8, padding:"18px 20px" }}>
      <div style={{ fontFamily:"var(--mono)", fontSize:10, color:"var(--muted)", letterSpacing:2, textTransform:"uppercase", marginBottom:6 }}>{label}</div>
      <div style={{ fontFamily:"var(--mono)", fontSize:30, fontWeight:700, color, lineHeight:1, marginBottom:4 }}>{value}</div>
      {sub && <div style={{ fontSize:12, color:"var(--muted)" }}>{sub}</div>}
    </div>
  );
}

// ── Badge ────────────────────────────────────────────────────────────────────
function Badge({ label }) {
  const isAttack = label && label.trim().toUpperCase() !== "BENIGN";
  const c = isAttack ? "var(--red)" : "var(--green)";
  const txt = isAttack ? label.trim() : "BENIGN";
  return (
    <span style={{ background:c+"22", color:c, border:`1px solid ${c}55`, borderRadius:4,
                   padding:"2px 8px", fontSize:10, fontFamily:"var(--mono)", fontWeight:700, letterSpacing:1,
                   whiteSpace:"nowrap", display:"inline-block", maxWidth:160, overflow:"hidden", textOverflow:"ellipsis" }}>
      {txt}
    </span>
  );
}

// ── Main ─────────────────────────────────────────────────────────────────────
function App() {
  const [rows,       setRows]       = useState([]);
  const [loading,    setLoading]    = useState(true);
  const [error,      setError]      = useState(null);
  const [lastRefresh,setLastRefresh]= useState(null);
  const [filter,     setFilter]     = useState("all");
  const [page,       setPage]       = useState(1);
  const [alertMsg,   setAlertMsg]   = useState(null);
  const PER_PAGE = 12;

  // ── Rolling spike history ─────────────────────────────────────────────────
  const spikeRef      = useRef([]);  // [{t, normal, attack}]
  const prevRef       = useRef({ total:0, attacks:0 });
  const isFirstRef    = useRef(true); // skip bulk-count on first poll
  const [spike, setSpike] = useState([]);

  // ── Fetch ─────────────────────────────────────────────────────────────────
  const fetchData = useCallback(async () => {
    try {
      const res  = await fetch(`${API}/api/anomalies`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      // compute deltas for spike chart
      const total   = data.length;
      const attacks = data.filter(r => r.label && r.label.trim().toUpperCase() !== "BENIGN").length;

      if (isFirstRef.current) {
        // first poll: set baseline silently — don't spike the chart
        prevRef.current = { total, attacks };
        isFirstRef.current = false;
      } else {
        const dTotal  = Math.max(0, total   - prevRef.current.total);
        const dAttack = Math.max(0, attacks - prevRef.current.attacks);
        const dNormal = Math.max(0, dTotal  - dAttack);
        prevRef.current = { total, attacks };

        const now = new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
        spikeRef.current.push({ t: now, normal: dNormal, attack: dAttack });
        if (spikeRef.current.length > WINDOW) spikeRef.current.shift();
        setSpike([...spikeRef.current]);

        if (dAttack >= 5) {
          setAlertMsg(`⚠ Attack burst detected — ${dAttack} packets`);
          setTimeout(() => setAlertMsg(null), 4000);
        }
      }

      setRows(data);
      setLastRefresh(new Date());
      setError(null);
    } catch(e) {
      setError(`Cannot reach Flask API at ${API} — make sure api/app.py is running`);
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => {
    fetchData();
    const t = setInterval(fetchData, POLL_MS);
    return () => clearInterval(t);
  }, [fetchData]);

  // ── Derived stats ─────────────────────────────────────────────────────────
  const total   = rows.length;
  const attacks = rows.filter(r => r.label && r.label.trim().toUpperCase() !== "BENIGN").length;
  const normals = total - attacks;

  // ── Spike chart data ──────────────────────────────────────────────────────
  const spikeData = {
    labels: spike.map(s => s.t),
    datasets: [
      {
        label: "Normal",
        data: spike.map(s => s.normal),
        borderColor: "#00d4ff",
        backgroundColor: "#00d4ff18",
        fill: true,
        tension: 0.35,
        pointRadius: 2,
        pointBackgroundColor: "#00d4ff",
        borderWidth: 1.5,
      },
      {
        label: "Attack",
        data: spike.map(s => s.attack),
        borderColor: "#ff4757",
        backgroundColor: "#ff475730",
        fill: true,
        tension: 0.35,
        pointRadius: s => s.raw > 0 ? 4 : 2,
        pointBackgroundColor: "#ff4757",
        borderWidth: 2,
      },
    ],
  };
  const spikeOpts = {
    animation: false,
    plugins: {
      legend: { display:true, position:"top", align:"end",
                labels:{color:"#94a3b8", font:{family:"JetBrains Mono",size:10}, boxWidth:10, padding:12} },
      tooltip: { backgroundColor:"#111827", titleFont:{family:"JetBrains Mono",size:11}, bodyFont:{family:"JetBrains Mono",size:11} },
    },
    scales: {
      x: { ticks:{color:"#475569",font:{size:9},maxTicksLimit:10}, grid:{color:"#1e2d4520"} },
      y: { min:0, ticks:{color:"#475569",font:{size:9}}, grid:{color:"#1e2d4520"}, title:{display:true,text:"pkts / 2s",color:"#475569",font:{size:9}} },
    },
  };

  // ── Protocol pie ──────────────────────────────────────────────────────────
  const protoMap = {};
  rows.forEach(r => { const p = r.protocol||"?"; protoMap[p]=(protoMap[p]||0)+1; });
  const protoEntries = Object.entries(protoMap).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const pieColors = ["#00d4ff","#ff4757","#2ed573","#ffa502","#a55eea","#fd9644"];
  const pieData   = {
    labels: protoEntries.map(([k])=>k),
    datasets:[{ data: protoEntries.map(([,v])=>v), backgroundColor: pieColors.map(c=>c+"88"), borderColor: pieColors, borderWidth:2 }]
  };
  const pieOpts = {
    plugins:{ legend:{ display:true, position:"bottom", labels:{color:"#64748b",font:{family:"JetBrains Mono",size:10},padding:8} },
              tooltip:{ backgroundColor:"#111827" } },
    cutout:"55%",
  };

  // ── Attack types breakdown ────────────────────────────────────────────────
  const attackTypeMap = {};
  rows.filter(r => r.label && r.label.trim().toUpperCase() !== "BENIGN")
      .forEach(r => { const t = r.label.trim(); attackTypeMap[t]=(attackTypeMap[t]||0)+1; });
  const attackEntries = Object.entries(attackTypeMap).sort((a,b)=>b[1]-a[1]);
  const atkColors = ["#ff4757","#ffa502","#a55eea","#fd9644","#ff6b81","#eccc68"];
  const atkData = {
    labels: attackEntries.map(([k])=>k),
    datasets:[{ data: attackEntries.map(([,v])=>v), backgroundColor: atkColors.map(c=>c+"99"), borderColor: atkColors, borderWidth:2 }]
  };
  const atkOpts = {
    indexAxis:"y",
    animation: false,
    plugins:{ legend:{display:false}, tooltip:{backgroundColor:"#111827",bodyFont:{family:"JetBrains Mono",size:11}} },
    scales:{
      x:{ ticks:{color:"#475569",font:{size:9}}, grid:{color:"#1e2d4520"} },
      y:{ ticks:{color:"#e2e8f0",font:{family:"JetBrains Mono",size:10}}, grid:{display:false} },
    },
  };

  // ── Table ─────────────────────────────────────────────────────────────────
  const filtered = rows.filter(r => {
    if (filter==="attack")  return r.label && r.label.trim().toUpperCase() !== "BENIGN";
    if (filter==="benign")  return r.label && r.label.trim().toUpperCase() === "BENIGN";
    return true;
  });
  const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
  const tableRows  = [...filtered].reverse().slice((page-1)*PER_PAGE, page*PER_PAGE);

  const mono = { fontFamily:"var(--mono)", fontSize:11 };

  if (loading) return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",flexDirection:"column",gap:16}}>
      <div style={{width:36,height:36,border:"2px solid var(--border)",borderTop:"2px solid var(--accent)",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
      <span style={{...mono,color:"var(--muted)"}}>Connecting to Flask API...</span>
    </div>
  );

  return (
    <div style={{maxWidth:1400,margin:"0 auto",padding:"20px 18px"}}>

      {/* Header */}
      <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:24,flexWrap:"wrap",gap:10}}>
        <div>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
            <div style={{width:8,height:8,borderRadius:"50%",background:error?"#ff4757":"#2ed573",
                         boxShadow:error?"0 0 8px #ff4757":"0 0 8px #2ed573",animation:"pulse 2s infinite"}}/>
            <span style={{...mono,fontSize:10,color:"var(--muted)",letterSpacing:2,textTransform:"uppercase"}}>
              {error?"API OFFLINE":"LIVE · 2s REFRESH"}
            </span>
          </div>
          <h1 style={{fontSize:22,fontWeight:600,fontFamily:"var(--mono)",letterSpacing:-0.5}}>Network Anomaly Detection</h1>
          <p style={{color:"var(--muted)",fontSize:12,marginTop:3}}>Random Forest · CICIDS 2017 · Flask + SQLite · P1 Elina</p>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          {lastRefresh && <span style={{...mono,fontSize:11,color:"var(--muted)"}}>Last: {fmtTime(lastRefresh.toISOString())}</span>}
          <button onClick={fetchData} style={{background:"var(--surface2)",border:"1px solid var(--border)",
            color:"var(--accent)",padding:"7px 14px",borderRadius:6,cursor:"pointer",fontFamily:"var(--mono)",fontSize:11,letterSpacing:1}}>
            ↺ REFRESH
          </button>
        </div>
      </div>

      {/* Alert banner */}
      {alertMsg && (
        <div style={{background:"#ff475720",border:"1px solid #ff475766",borderRadius:8,padding:"10px 16px",
                     marginBottom:16,fontFamily:"var(--mono)",fontSize:13,color:"#ff4757",animation:"flashIn 0.2s ease"}}>
          {alertMsg}
        </div>
      )}

      {/* Error */}
      {error && (
        <div style={{background:"#ff475718",border:"1px solid #ff475744",borderRadius:8,padding:"10px 16px",
                     marginBottom:16,fontFamily:"var(--mono)",fontSize:12,color:"#ff4757"}}>
          ⚠ {error}
        </div>
      )}

      {/* Stat cards */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12,marginBottom:20}}>
        <Card label="Total Packets"   value={total.toLocaleString()}   sub="stored in SQLite"          color="var(--accent)" />
        <Card label="Attack Traffic"  value={attacks.toLocaleString()} sub="non-BENIGN labels"          color="var(--red)"    />
        <Card label="Normal Traffic"  value={normals.toLocaleString()} sub="BENIGN labels"              color="var(--green)"  />
        <Card label="Attack Rate"     value={total?((attacks/total)*100).toFixed(1)+"%":"0%"} sub="of all traffic" color="var(--warn)" />
      </div>

      {/* ── SPIKE CHART ───────────────────────────────────────────────────── */}
      <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:8,padding:20,marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
          <span style={{...mono,fontSize:10,color:"var(--muted)",letterSpacing:2,textTransform:"uppercase"}}>Live Traffic Rate</span>
          <span style={{...mono,fontSize:10,color:"var(--muted)"}}>— packets per 2s rolling window (last {WINDOW} samples)</span>
          <span style={{marginLeft:"auto",...mono,fontSize:10,color:spike.length&&spike[spike.length-1].attack>0?"#ff4757":"var(--muted)"}}>
            {spike.length&&spike[spike.length-1].attack>0
              ? `🔴 ATTACK BURST — ${spike[spike.length-1].attack} pkts`
              : "● Normal"}
          </span>
        </div>
        <ChartCanvas type="line" data={spikeData} options={spikeOpts} height={200} />
      </div>

      {/* Attack types bar */}
      {attackEntries.length > 0 && (
        <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:8,padding:20,marginBottom:16}}>
          <p style={{...mono,fontSize:10,color:"var(--muted)",letterSpacing:2,textTransform:"uppercase",marginBottom:14}}>
            Detected Attack Types <span style={{color:"var(--red)"}}>{attackEntries.length}</span>
          </p>
          <ChartCanvas type="bar" data={atkData} options={atkOpts} height={Math.max(80, attackEntries.length * 28)} />
        </div>
      )}

      {/* Protocol + Table */}
      <div style={{display:"grid",gridTemplateColumns:"240px 1fr",gap:16,marginBottom:24}}>
        <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:8,padding:20}}>
          <p style={{...mono,fontSize:10,color:"var(--muted)",letterSpacing:2,textTransform:"uppercase",marginBottom:14}}>By Protocol</p>
          <ChartCanvas type="doughnut" data={pieData} options={pieOpts} height={210} />
        </div>

        {/* Table */}
        <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:8,padding:20}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,flexWrap:"wrap",gap:8}}>
            <p style={{...mono,fontSize:10,color:"var(--muted)",letterSpacing:2,textTransform:"uppercase"}}>
              Packet Log <span style={{color:"var(--accent)"}}>{filtered.length.toLocaleString()}</span>
            </p>
            <div style={{display:"flex",gap:5}}>
              {["all","attack","benign"].map(f => (
                <button key={f} onClick={()=>{setFilter(f);setPage(1);}} style={{
                  background: filter===f?"var(--accent)":"var(--surface2)",
                  color:      filter===f?"var(--bg)":"var(--muted)",
                  border:`1px solid ${filter===f?"var(--accent)":"var(--border)"}`,
                  borderRadius:4,padding:"4px 10px",cursor:"pointer",
                  fontFamily:"var(--mono)",fontSize:10,textTransform:"uppercase",letterSpacing:1,
                }}>{f}</button>
              ))}
            </div>
          </div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
              <thead>
                <tr style={{borderBottom:"1px solid var(--border)"}}>
                  {["ID","Time","Src IP","Dst IP","Proto","Label"].map(h=>(
                    <th key={h} style={{padding:"7px 10px",textAlign:"left",...mono,fontSize:9,color:"var(--muted)",letterSpacing:1,textTransform:"uppercase",fontWeight:400}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {tableRows.map((r,i)=>{
                  const isAtk = r.label && r.label.trim().toUpperCase() !== "BENIGN";
                  return (
                    <tr key={r.id} style={{borderBottom:"1px solid #1e2d4514",background:isAtk?"#ff47570a":"transparent"}}>
                      <td style={{padding:"7px 10px",...mono,color:"var(--muted)"}}>#{r.id}</td>
                      <td style={{padding:"7px 10px",...mono,whiteSpace:"nowrap"}}>{fmtTime(r.timestamp)}</td>
                      <td style={{padding:"7px 10px",...mono,color:"var(--accent)"}}>{r.src_ip}</td>
                      <td style={{padding:"7px 10px",...mono,color:"var(--muted)"}}>{r.dst_ip}</td>
                      <td style={{padding:"7px 10px",...mono,color:"var(--muted)"}}>{r.protocol}</td>
                      <td style={{padding:"7px 10px"}}><Badge label={r.label}/></td>
                    </tr>
                  );
                })}
                {tableRows.length===0&&(
                  <tr><td colSpan={6} style={{padding:24,textAlign:"center",color:"var(--muted)",...mono,fontSize:12}}>No rows match this filter</td></tr>
                )}
              </tbody>
            </table>
          </div>
          {totalPages>1&&(
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:10}}>
              <span style={{...mono,fontSize:11,color:"var(--muted)"}}>Page {page}/{totalPages}</span>
              <div style={{display:"flex",gap:5}}>
                <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1}
                  style={{background:"var(--surface2)",border:"1px solid var(--border)",color:page===1?"var(--border)":"var(--text)",
                  borderRadius:4,padding:"4px 10px",cursor:page===1?"default":"pointer",...mono,fontSize:11}}>← Prev</button>
                <button onClick={()=>setPage(p=>Math.min(totalPages,p+1))} disabled={page===totalPages}
                  style={{background:"var(--surface2)",border:"1px solid var(--border)",color:page===totalPages?"var(--border)":"var(--text)",
                  borderRadius:4,padding:"4px 10px",cursor:page===totalPages?"default":"pointer",...mono,fontSize:11}}>Next →</button>
              </div>
            </div>
          )}
        </div>
      </div>

      <div style={{borderTop:"1px solid var(--border)",paddingTop:14,display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:6}}>
        <span style={{...mono,fontSize:10,color:"var(--muted)"}}>Network Anomaly Detection System · P1 Elina · KIIT 2026</span>
        <span style={{...mono,fontSize:10,color:"var(--muted)"}}>Polling {API} every {POLL_MS/1000}s</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
